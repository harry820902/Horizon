name: Daily Horizon Summary

on:
  # GitHub Actions scheduled triggers proved unreliable for forks
  # (delayed up to 2 hours in real measurement on 2026-05-21). Replaced
  # with cron-job.org → workflow_dispatch trigger for ±1 min accuracy.
  # The schedule block is intentionally removed.
  workflow_dispatch:      # Triggered by cron-job.org every day at 07:30 Asia/Taipei

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          # Active: Gemini 2.5 Flash for analysis
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Inactive: kept for future provider switches
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run horizon --hours 24

      - name: Send compact Discord digest (Traditional Chinese, embed format)
        env:
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          DISCORD_DIGEST_LANG: zh
          DISCORD_DIGEST_MAX: "20"
        run: uv run python scripts/send_compact_discord.py

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
